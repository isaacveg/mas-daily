<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {%- feed_meta -%}
    {%- seo -%}
  </head>
  <body class="{{ page.layout | default: 'bare' }}-page">
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/' | relative_url }}#scope">筛选口径</a>
          <a class="nav-cta" href="https://github.com/{{ site.github_owner | default: 'isaacveg' }}/{{ site.github_repo | default: 'mas-daily' }}" target="_blank" rel="noopener">源码</a>
        </nav>
      </div>
    </header>
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <span>{{ site.title }} · 每天 11:00 自动更新</span>
      <span>论文版权归原作者所有，本站仅摘录标题与摘要并保留 arXiv 链接</span>
    </footer>
  </body>
</html>
