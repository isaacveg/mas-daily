# 每日多智能体系统论文日报 —— GitHub Pages 站点配置
# 说明：index.md / daily/ / assets/ 由 每日调查/scripts/publish_site.py 自动同步生成，
#       每次发布会覆盖这些内容，请勿手工修改。

title: 多智能体系统论文日报
description: >-
  arXiv 上多智能体系统 / LLM 智能体（MAS / LLM-Agent）方向的每日论文日报：
  只收录能识别出明确 T0/T1 机构的论文，摘要译为中文并配架构图与结果图。

theme: minima
lang: zh-CN
timezone: Asia/Shanghai
url: "https://isaacveg.github.io"
baseurl: "/mas-daily"

author:
  name: isaaczhu

minima:
  date_format: "%Y-%m-%d"
  show_excerpts: false

# assets/ 目录必须显式 include：Jekyll 只复制未排除的文件，显式列出可避免
# 因为 exclude/include 规则变动导致图片被漏掉（图片 404 的直接原因）。
include:
  - assets
  - daily

# 不进入站点的文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

sitemap: false

# 顶部导航只放首页，避免每期日报都挤进导航栏
header_pages:
  - index.md

defaults:
  - scope:
      path: "daily"
    values:
      layout: page
